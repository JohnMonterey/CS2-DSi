# CS:DS movement tuning.
#
# Values are in CS:GO's own units, exactly as the convars report them, so this
# file can be compared line by line against a real CS:GO config. Conversion to
# the engine's fixed point happens once, at load.
#
# This ships with every `make run-dsi`. To retune WITHOUT a rebuild, edit this
# file and push it into the running game:
#
#     make asset-dsi FILE=Counter-Strike-nds/movement.cfg
#
# Every value below is CS:GO's shipping default. Deleting a line, or the whole
# file, falls back to these same numbers compiled in.

# --- core movement -----------------------------------------------------------
gravity           = 800          # sv_gravity
jump_impulse      = 301.993377   # sv_jump_impulse; clears ~54.6 units in engine
stopspeed         = 80           # sv_stopspeed
friction          = 5.2          # sv_friction       (higher = stops sooner)
accelerate        = 5.5          # sv_accelerate     (higher = snappier start)

# --- air control -------------------------------------------------------------
# air_speed_cap only limits how much speed may be ADDED along the wish
# direction; airaccelerate scales how fast it is added. That asymmetry is what
# makes air-strafing work, so raising the cap does not simply mean "more air
# control" -- it mostly disables strafing instead.
airaccelerate     = 12           # sv_airaccelerate
air_speed_cap     = 30

# --- stamina: the reason bunnyhopping does not work --------------------------
# Jumping costs stamina_jumpcost * jump_impulse (24.16). Landing costs
# stamina_landcost * impact speed. Stamina recovers at stamina_recovery per
# second. Jump height scales with (1 - stamina/stamina_range); max speed scales
# with the SQUARE of it, which is why you are so slow just after landing.
stamina_max       = 80           # sv_staminamax
stamina_range     = 100          # STAMINA_RANGE
stamina_recovery  = 60           # sv_staminarecoveryrate
stamina_jumpcost  = 0.080        # sv_staminajumpcost
stamina_landcost  = 0.050        # sv_staminalandcost

# Belt and braces on top of stamina: horizontal speed is clamped to this
# multiple of the weapon's max speed at the instant of a jump.
bhop_factor       = 1.1          # BUNNYJUMP_MAX_SPEED_FACTOR

# --- crouch ------------------------------------------------------------------
duck_modifier     = 0.34         # CS_PLAYER_SPEED_DUCK_MODIFIER
duck_speed        = 8.0          # CS_PLAYER_DUCK_SPEED_IDEAL
duck_spam_penalty = 2.0          # charged on every press AND release
